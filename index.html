            function renderCustomTheme() {
                for (const color of customStyleColor) {
                    let currentColor = ''
                    if (color.name === 'secondary-color') {
                        currentColor = localStorage.getItem(color.name)
                        document.body.style.setProperty(`--${color.name}`, currentColor)
                        document.body.style.setProperty(`--${color.name}-transparent`, `${currentColor}d2`)
                        color.value = currentColor
                    } else if (color.name === 'primary-color') {
                        currentColor = localStorage.getItem(color.name)
                        document.body.style.setProperty(`--${color.name}`, currentColor)
                        document.body.style.setProperty(`--${color.name}-transparent`, `${currentColor}f1`)
                        color.value = currentColor
                    } else {
                        currentColor = localStorage.getItem(color.name)
                        document.body.style.setProperty(`--${color.name}`, currentColor)
                        color.value = currentColor
                    }
                }
            }

            function editCustomTheme() {
                for (const color of customStyleColor) {
                    if (color.name === 'secondary-color') {
                        localStorage.setItem(color.name, color.value)
                        document.body.style.setProperty(`--${color.name}`, color.value)
                        document.body.style.setProperty(`--${color.name}-transparent`, `${color.value}d2`)
                    } else if (color.name === 'primary-color') {
                        localStorage.setItem(color.name, color.value)
                        document.body.style.setProperty(`--${color.name}`, color.value)
                        document.body.style.setProperty(`--${color.name}-transparent`, `${color.value}f1`)
                    } else {
                        localStorage.setItem(color.name, color.value)
                        document.body.style.setProperty(`--${color.name}`, color.value)
                    }
                }
            }

            function clearCustomStyles() {
                for (const color of customStyleColor) {
                    document.body.style.setProperty(`--${color.name}`, '')
                    document.body.style.setProperty(`--${color.name}-transparent`, '')
                }
            }

            function changeSettingsPage(e) {
                for (let button of settingsButtons) {
                    button.classList.remove('selected-setting')
                }
                e.target.classList.add('selected-setting')
                
                themes.classList.remove('active-settings-page')
                equations.classList.remove('active-settings-page')
                website.classList.remove('active-settings-page')
                settingsMapping[e.target.name].classList.add('active-settings-page')
            }

            function changeTopEquation(e) {
                if(e.target.checked) {
                    localStorage.setItem('topEquationShown', "true")
                } else {
                    localStorage.setItem('topEquationShown', "false")
                }
                window.dispatchEvent(new CustomEvent('topEquationShownChange', {
                    detail: localStorage.getItem('topEquationShown')
                }))
            }

            function changePageTitle(e) {
                if (e.target.value === '') {

            function changeBackgroundImage() {
                if (backgroundImageBox.checked) {
                    localStorage.setItem('showBackgroundImage', 'true')
                    document.body.classList.remove('no-background')
                } else {
                    localStorage.setItem('showBackgroundImage', 'false')
                    document.body.classList.add('no-background')
                }
            }

            function checkBackgroundImage() {
                if (localStorage.getItem('showBackgroundImage')) {
                    if (localStorage.getItem('showBackgroundImage') === 'false') {
                        document.body.classList.add('no-background')
                        backgroundImageBox.checked = false
                    } else {
                        document.body.classList.remove('no-background')
                        backgroundImageBox.checked = true
                    }

                for (const item of waitUntilLoad) {

            function openMoreOptions(optionClass = "more-sidebar-option", closeOptionClass = "sidebar-option") {
                const sidebarOptions = document.getElementsByClassName(closeOptionClass)
                const otherOptions = document.getElementsByClassName(optionClass)
                for (const option of sidebarOptions) {
                    option.classList.add('option-hide')
                    setTimeout(() => {
                        option.classList.add('hidden')
                        option.classList.remove('option-hide')
                    }, 280)
                    setTimeout(() => {
                        for (const option of otherOptions) {
                            option.classList.add('option-show')
                            option.classList.remove('hidden')
                            setTimeout(() => {
                                option.classList.remove('option-show')
                            }, 300)
                        }
                    }, 340)
                }
            }

                window.location.replace("https://google.com/")
            }

            function downloadFile(filename, content, type) {
                const blob = new Blob([content], { type: type })

                const url = URL.createObjectURL(blob)

                const a = document.createElement('a')
                a.style.display = "none"
                a.href = url;
                a.download = filename;

                document.body.appendChild(a)
                a.click()
                document.body.removeChild(a)

                URL.revokeObjectURL(url)
            }

            function changeBackend() {
                localStorage.setItem('poxy', searchBackendChange.value)

            async function saveData() {
                const saveDataName = document.getElementById('save-name').value || ""
                let localStorageData = []
                let cookiesData = document.cookie
                // let indexDB = {}
                // Localstorage
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i)
                    const value = localStorage.getItem(key)
                    localStorageData.push({name: key, value: value})
                }
                const allData = {
                    localStorage: localStorageData,
                    cookies: cookiesData,
                }
                downloadFile(`otonicSave-${saveDataName.replaceAll(" ", "") === "" ?  Date.now() : saveDataName}`, JSON.stringify(allData), 'application/json')

            }

            /* Sidebar setup */

            body {
                background-image: url('/images/background.jpg');
                background-size: cover;
                background-attachment: fixed;
                font-family: "M PLUS Rounded 1c", sans-serif;
                font-weight: 700;
                font-style: normal;
                color: var(--text-color);
                padding: 0;
                transition: 0.4s;
                text-align: center;
                margin: auto;
            }

            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                background-color: var(--primary-color-transparent);
                z-index: -1;
            }

            .no-background::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                background-color: var(--primary-color);
                z-index: -1;
            }

            body.no-video-ad .pp-banner-partner,
            body.no-video-ad .pp-banner-iframe,
            body.no-video-ad .pp-anchor- container,
            body.no-video-ad .pp-corner-button {
                display: none !important;
            }

            body.collapsing {
                --sidebar-width: 49px;
                --collapsed-opacity: 0;
                --collapsed-visibility: inline-block;
                transition: 0.4s;
                --collapsed-margin: 70%;
                --sidebar-option-width: 16%;
                --sidebar-option-transform: 0;
            }

            body.expanding {
                --sidebar-width: 15%;
                --collapsed-opacity: 0;
                --collapsed-visibility: inline-block;
                transition: 0.4s;
                --visibility: visible;
            }

            body.collapsed {
                --sidebar-width: 49px;
                --collapsed-opacity: 0;
                --collapsed-visibility: none;
                transition: 0.4s;
                --collapsed-margin: 70%;
                --sidebar-option-width: 15%;
                --sidebar-option-transform: 0;
                --visibility: hidden;
            }

            a {
                text-decoration: none;
            }

            /* Sidebar and sidebar content */

            #unsupported-text {
                padding: 10px 20px;
                display: inline-block;
                position: absolute;
                background-color: var(--third-color);
                font-size: 12px;
                border-radius: 3px;
                z-index: 200;
                top: 0;
                left: 0;
            }





            aside button:focus {
                outline: none;
            }

                display: block;

                border: none;
                color: var(--text-color);

                font-size: 27px;
                transition: 0.3s;
                width: 35px;
                height: 35px;
                border-radius: 8px;
            }

            .close-settings:hover {

                transform: scale(1.25);
                transition: 0.3s;
                cursor: default;
            }

            .close-settings span {
                position: relative;
                bottom: 7px;
            }

                display: block;
                position: absolute;
                right: 12px;
                transform: translatey(-15%);
                transition: 0.4s;
            }

            .size-sidebar-button-shrunk {
                left: 0;
                transition: 0.4s;
                transform: translate(5%, -15%);
            }

            .settings {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                width: 37%;

261 5.336,9.261 4.951,9.645 L4.951,9.645 Z" class="si-glyph-fill"> </path> </g> </g> </g></svg>
                                <div id="fav-container">${favorites.includes(idObject.id) ? favSVG : notFavSVG}</div>
                            </div>
                        </div>
                        <iframe id="equation-iframe"></iframe>
                        `
                        equationFrame.classList.add('loaded')



                        const equationIframe = document.getElementById('equation-iframe')
                        
                        addCloseListener(equationIframe)
                        addFullscreenListener()
                        addFavListener(idObject.id)
                        
                        
                        const iframeLoaded = new Promise(resolve => {
                            equationIframe.addEventListener("load", resolve, { once: true })
                        })
                        equationIframe.srcdoc = `<style>h1 { color: white; text-shadow: 0 0 4px black; text-align: center; }</style><h1>Loading...</h1><h1 id='progress'>0MB / ${(manifest.size / 1048576).toFixed(2)}MB</h1>`

                        await iframeLoaded

                        const progress = equationIframe.contentDocument.getElementById("progress")

                        async function downloadPart(part, i, sha) {
                            const url = `${atob(cu)}@${sha}/e/${idObject.split.split("/")[0]}/${part.name}`
                            let lastError

                            for (let attempt = 0; attempt < 6; attempt++) {
                                try {
                                    loaded -= partProgress[i]
                                    partProgress[i] = 0

                                    const r = await fetch(attempt === 0 ? url : `${url}?retry=${attempt}-${Date.now()}`)
                                    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`)

                                    const reader = r.body.getReader()
                                    const chunks = []

                                    for (;;) {
                                        const { done, value } = await reader.read()
                                        if (done) break
                                        chunks.push(value)
                                        partProgress[i] += value.byteLength
                                        loaded += value.byteLength
                                        progress.textContent = `${(loaded / 1048576).toFixed(2)}MB / ${(manifest.size / 1048576).toFixed(2)}MB`
                                    }

                                    parts[i] = new Blob(chunks)
                                    return
                                } catch (error) {
                                    lastError = error

                                    if (attempt < 5) {
                                        await new Promise(resolve => setTimeout(resolve, 750 * (attempt + 1)))
                                    }
                                }
                            }

                            loaded -= partProgress[i]
                            partProgress[i] = 0
                            throw new Error(`Failed to download ${part.name}: ${lastError}`)
                        }

                        let nextPart = 0

                        async function downloadWorker() {
                            for (;;) {
                                const i = nextPart++
                                if (i >= manifest.parts.length) return
                                await downloadPart(manifest.parts[i], i, idObject.sha)
                            }
                        }

                        await Promise.all(
                            Array.from(
                                { length: Math.min(32, manifest.parts.length) },
                                () => downloadWorker()
                            )
                        )

                        const blob = new Blob(parts, { type: manifest.mime })

                        if (blob.size !== manifest.size) {
                            throw new Error(`assembled ${blob.size} bytes, expected ${manifest.size}`)
                        }

                        const url = URL.createObjectURL(blob)

                        equationIframe.removeAttribute('srcdoc')
                        equationIframe.src = url

                        favorites = JSON.parse(favorites)
                        if (idObject.name === 'Shellshockers') {
                            window.location.href = '/equations/shellshock'
                        }
                    }
                }
            }

            loadEquationEmbed()

            async function closeFrame(equationIframe) {
                equationFrame.innerHTML = `
                    <div class="equation-embed-bar">
                        <h3>Equation</h3>
                            <div class="frame-options">
                                <p class="equation-frame-close" id="equation-frame-close">x</p>
                            </div>
                    </div>
                `

                const url = new URL(window.location.href);
                url.search = ""
                
                equationFrame.classList.remove('loaded')
                setTimeout(() => equationIframe.classlist.remove("hidden"), 1000)
                try {
                    window.history.replaceState({}, document.title, url.toString());
                } catch (err) {

                }
            }

            function addCloseListener() {
                const frameClose = document.getElementById('equation-frame-close')
                frameClose.addEventListener('click', closeFrame)
            }

            function addFullscreenListener() {
                const fullScreen = document.getElementById('equation-frame-fullscreen')
                fullScreen.addEventListener('click', fullscreen)
            }

            function addFavListener(id) {
                let favorites = localStorage.getItem("otonicFavs") || "[]"
                favorites = JSON.parse(favorites)
                const fav = document.getElementById('equation-frame-favorite')
                const favContainer = document.getElementById('fav-container')

                if (favorites.includes(id)) {
                    fav.addEventListener('click', () => {
                        let favs = localStorage.getItem("otonicFavs") || "[]"
                        favs = JSON.parse(favs)
                        favContainer.innerHTML = notFavSVG
                        
                        favs = favs.filter(item => item !== id)
                        localStorage.setItem("otonicFavs", JSON.stringify(favs))
                        addFavListener(id)
                    })
                    return
                }

                fav.addEventListener('click', () => {
                    let favs = localStorage.getItem("otonicFavs") || "[]"
                    favs = JSON.parse(favs)
                    favContainer.innerHTML = favSVG
                    favs.push(id)
                    localStorage.setItem("otonicFavs", JSON.stringify(favs))
                    addFavListener(id)
                })
            }

            function fullscreen() {
                const equationIframe = document.getElementById('equation-iframe')
                if (equationIframe.requestFullscreen()) {
                    equationIframe.requestFullscreen()
                }
            }

            function searchEquations() {
                if (equationSearch.value) {
                    topEquationsDiv.classList.add("hidden")
                    renderCards(equationSearch.value)
                } else {
                    topEquationsDiv.classList.remove("hidden")
                    renderCards()
                }
            }


            function addCardListener() {
                for (let equation of equationCards) {
                    equation.addEventListener('click', function() {
                        const newParams = new URLSearchParams({id: equation.dataset.id})
                        loadEquationEmbed(equation.dataset.id)
                        try {
                            window.history.pushState({}, "", "?" + newParams.toString())
                        } catch (err) {

                        }
                    })
                }
            }
            addCardListener()
        </script>
